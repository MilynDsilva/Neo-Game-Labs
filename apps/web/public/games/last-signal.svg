<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">The Last Signal abstract game artwork</title>
  <desc id="description">A lone underwater station receiving a mysterious green signal.</desc>
  <defs>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#12344a"/><stop offset=".45" stop-color="#08232f"/><stop offset="1" stop-color="#02080d"/>
    </linearGradient>
    <radialGradient id="signal">
      <stop stop-color="#a7f3d0" stop-opacity=".9"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#depth)"/>
  <circle cx="900" cy="220" r="250" fill="url(#signal)"/>
  <g fill="none" stroke="#6ee7b7" opacity=".55">
    <circle cx="900" cy="220" r="70" stroke-width="5"/><circle cx="900" cy="220" r="125" stroke-width="3"/><circle cx="900" cy="220" r="185" stroke-width="2"/>
  </g>
  <path d="M0 680 240 590l220 55 220-80 250 55 270-85v265H0z" fill="#031116"/>
  <path d="M380 585h240l50 70H330z" fill="#172f34" stroke="#5eead4" stroke-width="5"/>
  <path d="M470 585V390h65v195M430 420h145" stroke="#5eead4" stroke-width="8"/>
  <circle cx="502" cy="375" r="18" fill="#d1fae5"/>
  <g fill="#99f6e4" opacity=".5">
    <circle cx="100" cy="180" r="5"/><circle cx="230" cy="310" r="3"/><circle cx="720" cy="450" r="4"/>
  </g>
  <text x="70" y="120" fill="#ecfdf5" font-family="sans-serif" font-size="58" font-weight="700" letter-spacing="9">THE LAST SIGNAL</text>
</svg>
