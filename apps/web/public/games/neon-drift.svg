<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Neon Drift abstract game artwork</title>
  <desc id="description">A neon road running through a blue and pink futuristic city.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#071128"/>
      <stop offset="1" stop-color="#30124f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="1">
      <stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#f472b6"/>
