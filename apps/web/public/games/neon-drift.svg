  <path d="m510 560 170-10 70 70-295 8z" fill="#f8fafc"/>
  <text x="70" y="710" fill="#fff" font-family="sans-serif" font-size="72" font-style="italic" font-weight="800" letter-spacing="7">NEON DRIFT</text>
</svg>
