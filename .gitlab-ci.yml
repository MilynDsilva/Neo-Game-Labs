include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - build

variables:
  PNPM_STORE_DIR: .pnpm-store

.node_job:
  image: node:22
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - npm install --global pnpm@10.17.0
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

quality:
  extends: .node_job
  stage: validate
  script:
    - pnpm format:check
    - pnpm lint
    - pnpm typecheck
    - pnpm test

dependency_audit:
  extends: .node_job
  stage: test
  script:
    - pnpm audit --prod --audit-level high

build:
  extends: .node_job
  stage: build
  script:
    - pnpm build
